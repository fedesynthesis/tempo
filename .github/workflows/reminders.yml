name: TEMPO — reminder & digest
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tempo-reminders
  cancel-in-progress: true
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: scheduler
        run: npm install --no-audit --no-fund
      - name: Loop
        working-directory: scheduler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          end=$((SECONDS+3300))
          i=0
          while :; do
            i=$((i+1)); echo "=== giro $i ($(date -u +%H:%M:%SZ)) ==="
            node send-reminders.js || echo "giro fallito, continuo"
            [ $SECONDS -ge $end ] && break
            sleep 60
          done 
