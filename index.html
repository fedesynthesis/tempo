<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TEMPO — Task & Calendario</title>
<meta name="apple-mobile-web-app-title" content="TEMPO">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/motion@13.1.0/dist/motion.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f2ea; --bg2:#ece9df; --surface:#fdfcf8; --surface2:#f2efe6;
  --line:#e6e2d6; --line2:#d8d3c4;
  --txt:#201c17; --txt2:#79736a; --txt3:#a79f93;
  --accent:#b8492c; --accent-deep:#9c3c22; --accent-hi:#cc5a3b; --accent-soft:rgba(184,73,44,.09);
  --ok:#3f7a4a; --ok-soft:rgba(63,122,74,.13);
  --warn:#c0801a; --blue:#3b5c9f; --danger:#c0392b;
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --disp:'Fraunces',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px; --r-s:11px; --r-l:22px;
  --sh:0 1px 2px rgba(40,28,20,.04),0 6px 18px -14px rgba(40,28,20,.12);
  --sh-lg:0 14px 46px -12px rgba(40,28,20,.26);
  --nav-h:64px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--txt);
  font-size:16px;line-height:1.45;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body.lock{overflow:hidden}
#root{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:0;height:0}
.mono{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.muted{color:var(--txt2)} .dim{color:var(--txt3)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.08}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.eyebrow{font-family:var(--disp);font-style:italic;font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:500}
.chiprow{touch-action:pan-x}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(var(--bg) 72%,rgba(246,246,243,0));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent-hi),var(--accent-deep));
  display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(255,90,60,.5);flex:none}
.logo svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.4}
.brand b{font-family:var(--disp);font-weight:500;letter-spacing:0;font-size:23px}
.brand b span{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);color:var(--txt2);box-shadow:var(--sh)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}

main{padding:6px 18px calc(var(--nav-h) + 34px) 18px}
.view>*{animation:riseIn .5s var(--ease) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}
.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Hero (Oggi) ---------- */
.hero{padding:8px 4px 4px}
.hero .day{font-family:var(--disp);font-size:15px;font-weight:500;color:var(--accent);text-transform:capitalize;font-style:italic}
.hero .big{font-family:var(--disp);font-weight:400;font-size:52px;line-height:.98;letter-spacing:-.01em;margin-top:6px;color:var(--txt)}
.hero .sub{margin-top:12px;color:var(--txt2);font-size:14px;font-weight:500}
.hero .sub b{color:var(--txt)}
.pbar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);margin-top:14px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-hi),var(--accent));transition:width .6s var(--ease)}

/* ---------- Quick add ---------- */
.qadd{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 6px 6px 16px;box-shadow:var(--sh);margin-top:18px}
.qadd input{flex:1;border:none;background:none;outline:none;padding:11px 0;font-weight:500}
.qadd input::placeholder{color:var(--txt3)}
.qadd .go{width:40px;height:40px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -4px rgba(255,90,60,.55)}
.qadd .go svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.6}

/* ---------- Section header ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:34px 6px 10px}
.sec-h .cnt{font-size:12px;font-weight:700;color:var(--txt3);background:var(--surface2);border:1px solid var(--line);
  padding:2px 9px;border-radius:99px}

/* ---------- Task row ---------- */
.list{display:flex;flex-direction:column;gap:0}
.row{display:flex;gap:14px;align-items:flex-start;background:transparent;border:none;border-bottom:1px solid var(--line);
  border-radius:0;padding:16px 6px;box-shadow:none;width:100%;text-align:left;position:relative}
.list .row:last-child{border-bottom:none}
.row:active{background:var(--surface2)}
.row.done{background:transparent}
.ck{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line2);flex:none;margin-top:1px;
  display:grid;place-items:center;background:var(--surface);transition:transform .2s var(--ease),background .2s,border-color .2s}
.ck svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;opacity:0;transform:scale(.4);transition:.2s var(--ease)}
.row.done .ck{background:var(--txt);border-color:var(--txt)}
.row.done .ck svg{opacity:1;transform:scale(1)}
.ck.pri-high{border-color:var(--accent)} .ck.pri-med{border-color:var(--warn)} .ck.pri-low{border-color:var(--blue)}
.row .body{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:15.5px;letter-spacing:-.01em;word-break:break-word}
.row.done .ttl{color:var(--txt3);text-decoration:line-through}
.row .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--txt2);font-weight:500}
.row .meta .m{display:inline-flex;align-items:center;gap:4px}
.row .meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.row .meta .late{color:var(--danger)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.high{background:var(--accent)} .dot.med{background:var(--warn)} .dot.low{background:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);
  padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--txt2)}
.drag{flex:none;align-self:center;display:grid;place-items:center;width:36px;height:40px;margin-left:2px;
  color:var(--line2);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.drag:active{cursor:grabbing}
.drag svg{width:20px;height:20px;fill:currentColor;stroke:none}
@media(hover:hover){.row:hover{background:var(--surface2)}.row:hover .drag{color:var(--txt3)}.iconbtn:hover{border-color:var(--line2)}}

/* ---------- Chips / filters ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);
  font-size:13px;font-weight:600;color:var(--txt2);white-space:nowrap;flex:none;transition:.18s var(--ease)}
.chip.on{background:var(--txt);border-color:var(--txt);color:#fff;box-shadow:0 6px 16px -6px rgba(20,20,25,.4)}
.chip:active{transform:scale(.95)}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;display:inline-block;vertical-align:-2px;margin-right:2px}

/* categorie */
.catchip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh);font-size:13px;font-weight:600;color:var(--txt2);white-space:nowrap;flex:none;transition:.16s var(--ease)}
.catchip i{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--txt3));flex:none}
.catchip.on{color:#fff;background:var(--cc,var(--txt2));border-color:var(--cc,var(--txt2))}
.catchip.on i{background:#fff}
.catchip:active{transform:scale(.95)}
.catchip.sm{padding:6px 11px;font-size:12.5px}
.catchip.mng{padding:8px 11px;color:var(--txt3)}
.catmng{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;box-shadow:var(--sh);margin:2px 0 6px}
.cmrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.cmrow:last-child{border-bottom:none}
.cmdot{width:11px;height:11px;border-radius:50%;background:var(--cc);flex:none}
.cminput{flex:1;min-width:110px;border:none;background:none;outline:none;font-weight:700;font-size:14px}
.cmdel{color:var(--txt3);width:30px;height:30px;display:grid;place-items:center;flex:none}
.cmdel svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.cmsubs{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:20px}
.cmsub{display:inline-flex;align-items:center;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 9px;font-size:12px;font-weight:600;color:var(--txt2)}
.cmsub button{color:var(--txt3);width:18px;height:18px;display:grid;place-items:center}
.cmsub button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6}
.cmsub.add{padding:3px 8px}
.cmsub.add input{border:none;background:none;outline:none;width:80px;font-size:12px;font-weight:600}

/* ---------- Search ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 14px;box-shadow:var(--sh)}
.search svg{width:18px;height:18px;stroke:var(--txt3);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:none;background:none;outline:none;font-weight:500}
.search input::placeholder{color:var(--txt3)}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--txt3)}
.empty .ic{width:60px;height:60px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;margin:0 auto 14px;box-shadow:var(--sh)}
.empty .ic svg{width:26px;height:26px;stroke:var(--txt3);fill:none;stroke-width:1.8}
.empty b{display:block;color:var(--txt);font-weight:700;font-size:15px;margin-bottom:3px}
.empty span{font-size:13.5px}

/* ---------- Calendar ---------- */
.calcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 14px 12px;box-shadow:var(--sh)}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.calhead b{font-family:var(--disp);font-weight:500;font-size:21px;text-transform:capitalize}
.calnav{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);
  border:1px solid var(--line);color:var(--txt2)}
.calnav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.wk span{text-align:center;font-size:11px;font-weight:700;color:var(--txt3);padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:14px;font-weight:600;color:var(--txt);position:relative;border:1.5px solid transparent;transition:.15s var(--ease)}
.cell.oth{color:var(--txt3);opacity:.5}
.cell.today{color:var(--accent);font-weight:800}
.cell.sel{background:var(--txt);color:#fff;border-color:var(--txt)}
.cell.sel.today{color:#fff}
.cell:active{transform:scale(.92)}
.cell .dots{display:flex;gap:3px;height:6px;align-items:center}
.cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--txt3)}
.cell .dots i.high{background:var(--accent)}
.cell .dots i.med{background:var(--warn)}
.cell .dots i.low{background:var(--blue)}
.cell.sel .dots i{background:#fff}
.cell .more{font-size:8px;line-height:1}
.daypanel{margin-top:18px}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.dayhead .dh{font-family:var(--disp);font-weight:500;font-size:19px;text-transform:capitalize}
.addhere{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border:1px solid rgba(255,90,60,.2);padding:8px 12px;border-radius:11px}
.addhere svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2.4}

/* ---------- FAB ---------- */
.fab{position:fixed;z-index:45;right:calc(50% - 260px + 18px);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,var(--accent-hi),var(--accent-deep));
  color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(255,90,60,.7)}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.6}
.fab:active{transform:scale(.9)}
@media(max-width:556px){.fab{right:18px}}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--txt3);
  font-size:10.5px;font-weight:700;letter-spacing:.01em;position:relative}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;
  background:var(--accent);animation:indIn .38s var(--ease)}
@keyframes indIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,20,25,.42);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;
  background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--sh-lg);
  transform:translateY(100%);transition:transform .34s var(--ease);
  max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.grab{padding:10px 0 4px;display:flex;justify-content:center;flex:none;cursor:grab;touch-action:none}
.grab i{width:40px;height:5px;border-radius:99px;background:var(--line2)}
.sheet .scroll{overflow-y:auto;padding:6px 18px 22px;-webkit-overflow-scrolling:touch}
.sheet .stitle{width:100%;border:none;background:none;outline:none;font-size:21px;font-weight:800;letter-spacing:-.02em;
  padding:6px 2px 10px;line-height:1.25}
.sheet .stitle::placeholder{color:var(--txt3)}
.field{margin-top:14px}
.field .lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin:0 2px 8px;display:flex;align-items:center;gap:6px}
.field .lbl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 13px;
  outline:none;font-weight:500;box-shadow:var(--sh)}
textarea.inp{resize:none;min-height:82px;line-height:1.5}
.two{display:flex;gap:10px}
.two>*{flex:1;min-width:0}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;color:var(--txt)}
.dtwrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:0 12px;box-shadow:var(--sh)}
.dtwrap svg{width:16px;height:16px;stroke:var(--txt3);fill:none;stroke-width:2;flex:none}
.dtwrap input{border:none;background:none;box-shadow:none;padding:12px 0;flex:1}
.winlbl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 5px}
.winchk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;color:var(--txt2);font-weight:500;background:none;border:none;text-align:left;padding:2px;width:100%}
.winchk .winbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;background:var(--surface);transition:.15s var(--ease)}
.winchk.on .winbox{background:var(--accent);border-color:var(--accent)}
.winchk .winbox svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3.2}
.remopts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.remgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.remopts .chip{white-space:normal}
.priopts{display:flex;gap:8px}
.priopts button{flex:1;padding:10px 4px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sh);transition:.16s var(--ease)}
.priopts button:active{transform:scale(.96)}
.priopts button.on{color:#fff}
.priopts button.on.p-none{background:var(--txt2);border-color:var(--txt2)}
.priopts button.on.p-low{background:var(--blue);border-color:var(--blue)}
.priopts button.on.p-med{background:var(--warn);border-color:var(--warn)}
.priopts button.on.p-high{background:var(--accent);border-color:var(--accent)}
.priopts button .d{width:8px;height:8px;border-radius:50%}
.p-none .d{background:var(--txt3)} .p-low .d{background:var(--blue)} .p-med .d{background:var(--warn)} .p-high .d{background:var(--accent)}
.priopts button.on .d{background:#fff}

/* subtasks */
.subs{display:flex;flex-direction:column;gap:7px}
.sub{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;box-shadow:var(--sh)}
.sub .sck{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;background:var(--surface)}
.sub .sck svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3.4;opacity:0}
.sub.done .sck{background:var(--txt);border-color:var(--txt)}
.sub.done .sck svg{opacity:1}
.sub .st{flex:1;font-size:14px;font-weight:500}
.sub.done .st{color:var(--txt3);text-decoration:line-through}
.sub .del{color:var(--txt3);width:26px;height:26px;display:grid;place-items:center}
.sub .del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.subadd{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1.5px dashed var(--line2);border-radius:var(--r-s);margin-top:7px}
.subadd svg{width:16px;height:16px;stroke:var(--txt3);fill:none;stroke-width:2.4;flex:none}
.subadd input{flex:1;border:none;background:none;outline:none;font-weight:500;font-size:14px}
.subadd input::placeholder{color:var(--txt3)}

/* attachments */
.atts{display:flex;flex-direction:column;gap:8px}
.att{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;box-shadow:var(--sh);text-align:left;width:100%}
.att .thumb{width:42px;height:42px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden}
.att .thumb img{width:100%;height:100%;object-fit:cover}
.att .thumb svg{width:20px;height:20px;stroke:var(--txt2);fill:none;stroke-width:1.9}
.att .info{flex:1;min-width:0}
.att .an{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .as{font-size:12px;color:var(--txt3);font-weight:500}
.att .del{color:var(--txt3);width:30px;height:30px;display:grid;place-items:center;flex:none}
.att .del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.attadd{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border:1.5px dashed var(--line2);
  border-radius:var(--r-s);color:var(--txt2);font-weight:700;font-size:14px;margin-top:8px}
.attadd svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}

/* telefono / chiamata */
.callbtn{margin-top:10px;text-decoration:none}
.callsug{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:11px 13px;border-radius:var(--r-s);
  background:var(--ok-soft);border:1px solid rgba(26,165,104,.28);color:var(--ok);font-weight:600;font-size:13.5px;text-align:left}
.callsug svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.callsug b{font-weight:800}

.sheetfoot{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:var(--r-s);
  font-weight:700;font-size:15px;transition:transform .1s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{flex:1;background:var(--accent);color:#fff;box-shadow:0 8px 20px -6px rgba(255,90,60,.6)}
.btn.del{background:rgba(229,72,77,.09);color:var(--danger);border:1px solid rgba(229,72,77,.22)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));z-index:70;
  transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;background:var(--txt);color:#fff;padding:12px 14px 12px 18px;border-radius:14px;
  box-shadow:var(--sh-lg);font-size:14px;font-weight:600;max-width:calc(100% - 32px);transition:.3s var(--ease)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast button{color:var(--accent-hi);font-weight:800;font-size:14px;padding:4px 8px}

/* visualizzatore allegati in-app */
.viewer{position:fixed;inset:0;z-index:80;background:rgba(18,18,20,.97);display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer .vbar{display:flex;align-items:center;gap:10px;padding:14px 14px;padding-top:max(14px,env(safe-area-inset-top));color:#fff}
.viewer .vname{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;flex:none}
.viewer .vbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.viewer .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 12px 34px}
.viewer .vbody img{max-width:100%;height:auto;border-radius:8px}
.viewer .vbody canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.viewer .vbody pre{white-space:pre-wrap;word-break:break-word;color:#eaeaea;font-family:var(--mono);font-size:13px;line-height:1.55;width:100%;max-width:680px;background:rgba(255,255,255,.05);padding:16px;border-radius:10px}
.viewer .vmsg{color:#fff;text-align:center;margin:48px auto 0;padding:0 24px;max-width:320px}
.viewer .vmsg .ic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.1);display:grid;place-items:center;margin:0 auto 14px}
.viewer .vmsg .ic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8}
.viewer .vspin{color:#fff;margin:60px auto;width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:vspin 1s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.32)}100%{transform:scale(1)}}
.pop{animation:pop .36s var(--ease)}
/* ---------- Tema "taccuino" (attivabile) ---------- */
body.paper{
  --bg:#fcfcfb; --bg2:#f3f3f1; --surface:#ffffff; --surface2:#f6f6f4;
  --line:#e6e6e2; --line2:#d7d7d1;
  --txt:#33302a; --txt2:#76736c; --txt3:#a9a69e;
  --accent:#c0442e; --accent-deep:#a5371f; --accent-hi:#d4563b; --accent-soft:rgba(192,68,46,.10);
  --blue:#3b5c9f; --ok:#4b7a3f; --warn:#c98a1e;
  --disp:'Caveat','Fraunces',cursive;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px);
  background-size:24px 24px, 24px 24px;
}
body.paper #root{background:transparent;box-shadow:none}
body.paper main{background:transparent}
/* riquadri a quadretti (task e schede) */
body.paper .card,body.paper .row,body.paper .qadd,body.paper .search,body.paper .calcard,body.paper .catmng{
  background-color:var(--surface);
  background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);
  background-size:22px 22px,22px 22px;
}
body.paper .topbar{background:linear-gradient(var(--bg) 72%,rgba(243,234,212,0))}
/* intestazioni scritte a mano */
body.paper .eyebrow{font-family:var(--disp);font-size:16px;letter-spacing:.01em;text-transform:none;color:var(--accent);font-weight:700}
body.paper h1,body.paper h2,body.paper h3{font-family:var(--disp);letter-spacing:0}
body.paper .brand b{font-family:var(--disp);font-size:25px}
body.paper .hero .big{font-size:54px;line-height:.95}
body.paper .hero .day{font-size:22px}
body.paper .sec-h .eyebrow{font-size:18px}
/* riquadri "disegnati a mano" */
body.paper .card,body.paper .row,body.paper .search,body.paper .qadd,body.paper .calcard,body.paper .catmng,
body.paper .sub,body.paper .att,body.paper .inp,body.paper .dtwrap,body.paper textarea.inp,
body.paper .priopts button,body.paper .chip,body.paper .catchip,body.paper .iconbtn,body.paper .pill,body.paper .cnt{
  border:1.6px solid var(--txt);
  box-shadow:1.5px 1.5px 0 rgba(59,51,39,.13);
  background-image:none;
}
body.paper .card,body.paper .row,body.paper .search,body.paper .qadd,body.paper .calcard,body.paper .catmng,body.paper .sheet{
  border-radius:17px 12px 18px 13px/13px 18px 12px 17px;
}
body.paper .chip,body.paper .catchip,body.paper .pill,body.paper .cnt{border-radius:20px 15px 18px 14px/15px 18px 14px 20px}
body.paper .iconbtn,body.paper .inp,body.paper .dtwrap,body.paper .priopts button{border-radius:12px 9px 13px 10px/10px 13px 9px 12px}
body.paper .btn.primary,body.paper .fab,body.paper .qadd .go,body.paper .logo{border:1.6px solid var(--txt);box-shadow:2px 2px 0 rgba(59,51,39,.22)}
body.paper .fab{border-radius:20px 16px 21px 17px/17px 21px 16px 20px}
body.paper .nav{background:rgba(255,253,244,.94);border-top:1.6px solid var(--txt)}
body.paper .pbar{border:1.5px solid var(--txt)}
body.paper .cell.sel{border-radius:14px 10px 15px 11px/11px 15px 10px 14px}
/* spunte quadrate con V disegnata a mano (rough.js) */
body.paper .ck,body.paper .sub .sck{position:relative;border:1.6px solid var(--txt);border-radius:4px;background:var(--surface);box-shadow:none}
body.paper .ck svg,body.paper .sub .sck svg{stroke:var(--accent);stroke-width:3.2}
body.paper .row.done .ck,body.paper .sub.done .sck{background:rgba(192,68,46,.10);border-color:var(--txt)}
body.paper.rough-ready .ck,body.paper.rough-ready .sub .sck{border-color:transparent;background:transparent}
body.paper.rough-ready .ck::before,body.paper.rough-ready .sub .sck::before{content:"";position:absolute;inset:-3px;background:var(--rough-box) center/100% 100% no-repeat;pointer-events:none}
body.paper.rough-ready .ck svg,body.paper.rough-ready .sub .sck svg{display:none}
body.paper.rough-ready .row.done .ck,body.paper.rough-ready .sub.done .sck{background:transparent}
body.paper.rough-ready .row.done .ck::after,body.paper.rough-ready .sub.done .sck::after{content:"";position:absolute;inset:-5px;background:var(--rough-check) center/100% 100% no-repeat;pointer-events:none}
/* ---------- Wizard nuovo task (a step) ---------- */
.wiz{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--bg);
  border-radius:26px 26px 0 0;box-shadow:var(--sh-lg);transform:translateY(100%);transition:transform .34s var(--ease);
  max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.wiz.on{transform:none}
.wizbar{padding:16px 18px 4px}
.wizprog{display:flex;gap:6px}
.wizprog i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s var(--ease)}
.wizprog i.on{background:var(--accent)}
.wizstep{padding:4px 20px 0;color:var(--accent);font-family:var(--disp);font-style:italic;font-size:14px}
.wizbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px 10px;flex:1;min-height:180px}
.wizq{font-family:var(--disp);font-size:25px;font-weight:400;letter-spacing:-.01em;color:var(--txt);margin:6px 2px 18px;line-height:1.15}
.wizinput{width:100%;border:none;background:none;outline:none;font-size:19px;font-weight:500;padding:4px 2px;resize:none;line-height:1.4;color:var(--txt)}
.wizinput::placeholder{color:var(--txt3)}
.wizerr{color:var(--danger);font-size:13px;font-weight:600;margin:8px 2px 0}
.wizfoot{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg);flex:none}
.wizfoot .sp{flex:1}
.wizlink{color:var(--txt2);font-weight:600;font-size:14px;background:none;border:none;padding:9px 6px}
.wizbtn{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;border-radius:var(--r-s);font-weight:700;font-size:15px;
  background:var(--surface);border:1px solid var(--line2);color:var(--txt);cursor:pointer}
.wizbtn.primary{background:var(--accent);color:#fff;border:none;box-shadow:0 6px 16px -6px rgba(184,73,44,.55)}
.wizbtn:active{transform:scale(.97)}
.wizbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}
.wizback{width:44px;height:44px;padding:0;justify-content:center;border-radius:12px}

/* ---------- Scritte stampi ---------- */
.scrgrid{display:flex;flex-direction:column;gap:0}
.scrcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 6px;border-bottom:1px solid var(--line);background:transparent}
.scrcard:last-child{border-bottom:none}
.scrcard:active{background:var(--surface2)}
.scrthumb{width:58px;height:58px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden}
.scrthumb img{width:100%;height:100%;object-fit:cover}
.scrthumb svg{width:22px;height:22px;stroke:var(--txt3);fill:none;stroke-width:1.8}
.scrinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.scrdesc{font-weight:600;font-size:16px;color:var(--txt);letter-spacing:-.01em;word-break:break-word}
.scrmeta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--txt2);font-weight:500;flex-wrap:wrap}
.scrtipo{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(184,73,44,.22);padding:2px 9px;border-radius:7px;font-weight:700}
.scrbig{width:100%;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);min-height:170px;display:grid;place-items:center;color:var(--txt3)}
.scrbig img{width:100%;height:auto;display:block}

/* ---------- Desktop / monitor (barra laterale) ---------- */
@media (min-width:900px){
  .wiz{left:232px;right:0;max-width:600px}
  :root{--nav-h:0px}
  #root{max-width:none;margin:0;padding-left:232px;box-shadow:none}
  .topbar{padding:16px 30px;border-bottom:1px solid var(--line);background:var(--surface);backdrop-filter:none}
  .brand b{font-size:24px}
  /* nav in basso → barra laterale */
  .nav{position:fixed;top:0;left:0;bottom:0;width:232px;max-width:none;margin:0;z-index:60;
    display:flex;flex-direction:column;align-items:stretch;gap:4px;
    background:var(--surface);border-top:none;border-right:1px solid var(--line);
    padding:74px 14px 20px;backdrop-filter:none}
  .nav button{flex-direction:row;justify-content:flex-start;gap:13px;padding:12px 14px;border-radius:12px;
    font-size:15px;font-weight:600;letter-spacing:0;color:var(--txt2)}
  .nav button svg{width:21px;height:21px}
  .nav button.on{background:var(--accent-soft);color:var(--accent)}
  .nav button.on::before{display:none}
  main{max-width:920px;margin:0 auto;padding:20px 44px 72px}
  .fab{position:fixed;left:auto;right:40px;bottom:32px;width:56px;height:56px}
  .sheet{left:232px;right:0;max-width:600px}
  .toast{left:calc(50% + 116px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root">

  </button>
  <button data-act="nav" data-view="cal">

  </button>
  <button data-act="nav" data-view="scritte">

</section>

<script>

const M = window.Motion || null;

/* ---- IndexedDB per i file allegati (+ sync su Firestore come base64) ---- */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('tempo-files',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function _filePut(id,file){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');
  tx.objectStore('files').put({id,name:file.name,type:file.type,size:file.size,blob:file});
  tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
async function _fileGetLocal(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly');
  const q=tx.objectStore('files').get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);});}
async function fileDel(id){const db=await openDB();return new Promise(res=>{const tx=db.transaction('files','readwrite');
  tx.objectStore('files').delete(id); tx.oncomplete=()=>res();});}
// comprime le immagini per stare sotto il limite di Firestore (~1MB per documento), restando leggibili
function compressImage(blob){ return new Promise(async(resolve)=>{ try{
  const img=await createImageBitmap(blob); let w=img.width,h=img.height;
  const maxDim=2000, sc=Math.min(1, maxDim/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
  const cv=document.createElement('canvas'); const draw=()=>{ cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); };
  const toB=(q)=> new Promise(r=> cv.toBlob(b=>r(b),'image/jpeg',q));
  draw(); let q=0.85, out=await toB(q), guard=0;
  while(out && out.size>650000 && guard<8){ guard++; if(q>0.5){ q-=0.12; } else { w=Math.round(w*0.82); h=Math.round(h*0.82); draw(); } out=await toB(q); }
  resolve(out||blob);
}catch(e){ resolve(blob); } }); }
// carica un file sul cloud (immagini compresse). Best-effort; segna gli id caricati.
async function cloudUpload(id, blob, name){
  if(!(window.fb && window.fb.ready && window.fb.uploadFile)) return {ok:false};
  try{
    let b=blob; if((blob.type||'').startsWith('image/')){ try{ b=await compressImage(blob); }catch(e){} }
    const r=await window.fb.uploadFile(id, b, name||blob.name||'');
    if(r && r.ok){ try{ const up=new Set(JSON.parse(localStorage.getItem('tempo_cloudfiles')||'[]')); up.add(id); localStorage.setItem('tempo_cloudfiles', JSON.stringify([...up])); }catch(e){} }
    return r||{ok:false};
  }catch(e){ return {ok:false}; }
}
// salva in locale e, in background, sincronizza sul cloud
async function fileSave(id,file){ await _filePut(id,file); cloudUpload(id,file,file.name).catch(()=>{}); }
// legge dal locale; se manca (altro dispositivo) lo scarica dal cloud e lo mette in cache locale
async function fileGet(id){
  const rec=await _fileGetLocal(id); if(rec) return rec;
  if(window.fb && window.fb.ready && window.fb.fetchFile){
    try{ const c=await window.fb.fetchFile(id); if(c && c.blob){ await _filePut(id, new File([c.blob], c.name||'file', {type:(c.type||c.blob.type||'')})); return await _fileGetLocal(id); } }catch(e){}
  }
  return null;
}
// carica sul cloud i file già presenti in locale ma non ancora sincronizzati (una volta)
async function cloudBackfill(){
  try{
    const up=new Set(JSON.parse(localStorage.getItem('tempo_cloudfiles')||'[]'));
    const ids=new Set();
    tasks.forEach(t=>(t.attachments||[]).forEach(a=>{ if(a&&a.id) ids.add(a.id); }));
    scritte.forEach(s=>{ if(s&&s.photoId) ids.add(s.photoId); });
    for(const id of ids){ if(up.has(id)) continue; const rec=await _fileGetLocal(id); if(rec && rec.blob){ await cloudUpload(id, rec.blob, rec.name); } }
  }catch(e){}
}

/* ============ DATE HELPERS ============ */
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => dstr(new Date());
function addDays(str,n){const [y,m,d]=str.split('-').map(Number);return dstr(new Date(y,m-1,d+n));}
function parseD(str){const [y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d);}
const fmtIt = (d,o) => new Intl.DateTimeFormat('it-IT',o).format(d);
function relDay(str){
  const t=todayStr();
  if(str===t)return 'Oggi';
  if(str===addDays(t,1))return 'Domani';
  if(str===addDays(t,-1))return 'Ieri';
  return fmtIt(parseD(str),{weekday:'short',day:'numeric',month:'short'});
}
function fmtSize(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function visibleTasks(){

    list = list.filter(t=>t.catId===state.catFilter);
    if(state.subFilter!=='all') list = list.filter(t=>t.subId===state.subFilter);
  }

function fillTaskList(){
  const el = $('#tlist'); if(!el) return;
  ensureOrders();
  const t = todayStr();
  let list = visibleTasks();
  const f = state.filter;

  if(f==='done'){
    const done = list.filter(x=>x.done).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    el.innerHTML = done.length? `<div style="height:14px"></div><div class="list">${done.map(rowHTML).join('')}</div>` : emptyHTML('check','Niente di completato','I task che spunti finiscono qui.');
    return;
  }
  if(f==='today') list=list.filter(x=>x.date===t);
  else if(f==='week') list=list.filter(x=>x.date&&x.date>=t&&x.date<=addDays(t,7));
  else if(f==='overdue') list=list.filter(x=>x.date&&x.date<t&&!x.done);
  else if(f==='nodate') list=list.filter(x=>!x.date);

  const open = list.filter(x=>!x.done);
  const secs = [
    ['Scaduti', open.filter(x=>x.date&&x.date<t)],
    ['Oggi', open.filter(x=>x.date===t)],
    ['Domani', open.filter(x=>x.date===addDays(t,1))],
    ['Prossimi 7 giorni', open.filter(x=>x.date&&x.date>addDays(t,1)&&x.date<=addDays(t,7))],
    ['Più avanti', open.filter(x=>x.date&&x.date>addDays(t,7))],
    ['Senza data', open.filter(x=>!x.date)],
  ];
  let h='';
  secs.forEach(([label,arr])=>{ if(arr.length){ h+=secH(label,arr.length); h+=`<div class="list">${openListHTML(arr.sort(byDate))}</div>`; } });
  if(f==='all'){
    const done = list.filter(x=>x.done).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,20);
    if(done.length){ h+=secH('Completati', done.length); h+=`<div class="list">${done.map(rowHTML).join('')}</div>`; }
  }
  el.innerHTML = h || emptyHTML('list','Nessun task','Tocca + per crearne uno.');
}

/* ---------- CALENDARIO ---------- */
const WD = ['L','M','M','G','V','S','D'];
function renderCal(){
  ensureOrders();
  const {y,m} = state.calMonth;
  const first = new Date(y,m,1);
  const monthName = fmtIt(first,{month:'long',year:'numeric'});
  let startDow = (first.getDay()+6)%7; // lun=0
  const daysIn = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const t = todayStr();

  let cells='';
  for(let i=0;i<startDow;i++){ const d=prevDays-startDow+1+i; cells+=cellHTML(new Date(y,m-1,d),true,t); }
  for(let d=1;d<=daysIn;d++){ cells+=cellHTML(new Date(y,m,d),false,t); }
  const total = startDow+daysIn; const trail=(7-total%7)%7;
  for(let d=1;d<=trail;d++){ cells+=cellHTML(new Date(y,m+1,d),true,t); }

  let h = `<div style="height:6px"></div>`;
  h += `<div class="calcard">
      <div class="calhead">
        <button class="calnav" data-act="cal-prev">${svg('cl')}</button>
        <b>${monthName}</b>
        <button class="calnav" data-act="cal-next">${svg('cr')}</button>
      </div>
      <div class="wk">${WD.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="grid">${cells}</div>
    </div>`;

  // pannello del giorno selezionato
  const sel = state.calSel;
  const dayOpen = tasks.filter(x=>x.date===sel && !x.done).sort(byDate);
  const dayDone = tasks.filter(x=>x.date===sel && x.done).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  h += `<div class="daypanel">
      <div class="dayhead">
        <div class="dh">${relDay(sel)}</div>
        <button class="addhere" data-act="new-on" data-date="${sel}">${svg('plus')} Aggiungi</button>
      </div>`;
  h += (dayOpen.length||dayDone.length) ? `<div class="list">${openListHTML(dayOpen)}${dayDone.map(rowHTML).join('')}</div>`
                       : emptyHTML('cal','Niente in programma','Tocca "Aggiungi" per pianificare qui.');
  h += `</div>`;
  main.innerHTML = h;
}
function cellHTML(d,oth,t){
  const s = dstr(d);
  const dayT = tasks.filter(x=>x.date===s && !x.done);
  const rank={high:0,med:1,low:2}; // mostra prima le priorità più alte
  const ord = dayT.slice().sort((a,b)=>(rank[a.priority]??3)-(rank[b.priority]??3));
  const cls = ['cell']; if(oth)cls.push('oth'); if(s===t)cls.push('today'); if(s===state.calSel)cls.push('sel');
  const dots = dayT.length
    ? `<div class="dots">${ord.slice(0,3).map(x=>`<i class="${x.priority||''}"></i>`).join('')}</div>`
    : `<div class="dots"></div>`;
  return `<button class="${cls.join(' ')}" data-act="cal-day" data-date="${s}"><span>${d.getDate()}</span>${dots}</button>`;
}

/* ============ ROW / SECTION ============ */
function secH(title,count){ return `<div class="sec-h"><div class="eyebrow">${title}</div><div class="cnt">${count}</div></div>`; }
function emptyHTML(ic,title,sub){ return `<div class="empty"><div class="ic">${svg(ic)}</div><b>${title}</b><span>${sub}</span></div>`; }
function byDate(a,b){
  const ad=a.date||'9999', bd=b.date||'9999';
  if(ad!==bd) return ad<bd?-1:1;
  // stesso giorno → ordine manuale (campo order)
  const ao=(typeof a.order==='number')?a.order:1e9, bo=(typeof b.order==='number')?b.order:1e9;
  if(ao!==bo) return ao-bo;
  return (a.createdAt||0)-(b.createdAt||0);
}
// vecchio ordinamento "intelligente" (ora, priorità): usato solo per il seed iniziale di order
function oldSortKey(a,b){
  const at=a.time||'99:99', bt=b.time||'99:99';
  if(at!==bt) return at<bt?-1:1;
  const rank={high:0,med:1,low:2};
  const pr=(rank[a.priority]??3)-(rank[b.priority]??3); if(pr) return pr;
  return (a.createdAt||0)-(b.createdAt||0);
}
// assegna order SOLO ai task che non ce l'hanno, in coda al loro giorno (non tocca gli altri → non litiga con la sync)
function ensureOrders(){
  const maxByDay={};
  tasks.forEach(t=>{ if(typeof t.order==='number'){ const k=t.date||''; maxByDay[k]=Math.max(maxByDay[k]??-1, t.order); } });
  const byDay={};
  tasks.filter(t=>typeof t.order!=='number').forEach(t=>{ (byDay[t.date||'']=byDay[t.date||'']||[]).push(t); });
  let changed=false;
  Object.entries(byDay).forEach(([k,arr])=>{ arr.sort(oldSortKey); let base=(maxByDay[k]??-1); arr.forEach(t=>{ base+=1; t.order=base; changed=true; }); });
  if(changed) save();
}
// rende una lista di task APERTI: mostra la maniglia di trascinamento solo se c'è almeno
// un altro task nello stesso giorno (altrimenti non c'è nulla da riordinare)
function openListHTML(arr){
  return arr.map(t=>{
    const sib = arr.some(o=>o!==t && (o.date||'')===(t.date||''));
    return rowHTML(t,{drag:sib});
  }).join('');
}

/* ---- Trascinamento task: riordino FLUIDO (metodo di Migross, con FLIP) ----
   Il segreto contro gli "scatti": le righe non trascinate scivolano con animazione
   FLIP; la riga trascinata segue il dito 1:1 (transition:none) con un accumulatore
   `shift` che compensa i riordini; i movimenti sono throttlati con requestAnimationFrame. */
let drag=null;
function dragY(e){ return (e.touches&&e.touches[0])?e.touches[0].clientY:e.clientY; }

function dragDown(e){
  const handle = e.target.closest ? e.target.closest('[data-act=drag]') : null;
  if(!handle) return;
  const row=handle.closest('.row'); const list=row&&row.closest('.list');
  if(!row||!list) return;
  const t=getTask(row.dataset.id); if(!t||t.done) return;
  // gruppo = righe contigue nello stesso .list con stessa data e non completate
  const all=[...list.children].filter(el=>el.classList&&el.classList.contains('row'));
  const same=el=>{ const x=getTask(el.dataset.id); return x&&!x.done&&(x.date||'')===(t.date||''); };
  let i=all.indexOf(row), lo=i, hi=i;
  while(lo-1>=0 && same(all[lo-1])) lo--;
  while(hi+1<all.length && same(all[hi+1])) hi++;
  const group=all.slice(lo,hi+1);
  if(group.length<2) return;                       // niente da riordinare
  e.preventDefault(); e.stopPropagation();

  drag={ row, list, group, start:dragY(e), shift:0, lastY:dragY(e), raf:0 };
  row.style.transition='none';                     // segue il dito senza lag
  row.style.zIndex='1000'; row.style.position='relative';
  row.style.background='var(--surface)';
  row.style.boxShadow='0 14px 30px -10px rgba(30,25,20,.35)';
  row.style.borderRadius='14px';
  row.style.borderBottomColor='transparent';
  row.style.transform='scale(1.02)';
  handle.style.cursor='grabbing';
  document.body.style.userSelect='none';

  document.addEventListener('mousemove', dragMove, {passive:false});
  document.addEventListener('touchmove', dragMove, {passive:false});
  document.addEventListener('mouseup', dragUp);
  document.addEventListener('touchend', dragUp);
  document.addEventListener('touchcancel', dragUp);
}

// FLIP: anima lo scivolamento delle righe non trascinate (niente salti)
function dragFlip(mutate){
  const rows=[...drag.list.querySelectorAll('.row')];
  const first=rows.map(r=>r.getBoundingClientRect().top);
  mutate();
  rows.forEach((r,i)=>{
    if(r===drag.row) return;
    const dy=first[i]-r.getBoundingClientRect().top;
    if(!dy) return;
    r.style.transition='none';
    r.style.transform='translateY('+dy+'px)';
    requestAnimationFrame(()=>{ r.style.transition='transform .18s cubic-bezier(.2,.7,.3,1)'; r.style.transform=''; });
  });
}

function dragMove(e){
  if(!drag) return;
  e.preventDefault();
  drag.lastY=dragY(e);
  if(drag.raf) return;
  drag.raf=requestAnimationFrame(dragApply);
}

function dragApply(){
  if(!drag) return;
  drag.raf=0;
  drag.row.style.transform='translateY('+((drag.lastY-drag.start)-drag.shift)+'px) scale(1.02)';
  // righe del gruppo in ordine DOM CORRENTE (come Migross: si ri-leggono ogni frame)
  const rows=[...drag.list.children].filter(el=>el.classList&&el.classList.contains('row')&&drag.group.includes(el));
  const idx=rows.indexOf(drag.row);
  const dRect=drag.row.getBoundingClientRect();
  const dMid=dRect.top+dRect.height/2;
  for(let i=0;i<rows.length;i++){
    const r=rows[i]; if(r===drag.row) continue;
    const rRect=r.getBoundingClientRect();
    const rMid=rRect.top+rRect.height/2;
    if(i<idx && dMid<rMid){
      const h=rRect.height;
      dragFlip(()=>drag.list.insertBefore(drag.row, r));
      drag.shift-=h;
      drag.row.style.transform='translateY('+((drag.lastY-drag.start)-drag.shift)+'px) scale(1.02)';
      break;
    } else if(i>idx && dMid>rMid){
      const h=rRect.height;
      dragFlip(()=>drag.list.insertBefore(drag.row, r.nextSibling));
      drag.shift+=h;
      drag.row.style.transform='translateY('+((drag.lastY-drag.start)-drag.shift)+'px) scale(1.02)';
      break;
    }
  }
}

function dragUp(){
  if(!drag) return;
  if(drag.raf){ cancelAnimationFrame(drag.raf); drag.raf=0; }
  const { row, list, group }=drag;
  document.removeEventListener('mousemove', dragMove);
  document.removeEventListener('touchmove', dragMove);
  document.removeEventListener('mouseup', dragUp);
  document.removeEventListener('touchend', dragUp);
  document.removeEventListener('touchcancel', dragUp);
  document.body.style.userSelect='';
  const handle=row.querySelector('.drag'); if(handle) handle.style.cursor='grab';
  row.style.transform='';   // già in posizione finale nel DOM

  // nuova sequenza (ordine DOM) → riassegno i valori di order del gruppo
  const seq=[...list.children].filter(el=>el.classList&&el.classList.contains('row')&&group.includes(el)).map(el=>el.dataset.id);
  const vals=seq.map(id=>{ const t=getTask(id); return (typeof t.order==='number')?t.order:0; }).sort((a,b)=>a-b);
  const changed=[];
  seq.forEach((id,i)=>{ const t=getTask(id); if(t && t.order!==vals[i]){ t.order=vals[i]; t.updatedAt=Date.now(); changed.push(t); } });
  drag=null;
  if(changed.length){ save(); changed.forEach(reconcile); }
  // il tap che segue il rilascio non deve aprire il task
  const swallow=ev=>{ ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click',swallow,true); };
  document.addEventListener('click',swallow,true);
  setTimeout(()=>document.removeEventListener('click',swallow,true),350);
  render();
}

// opzioni "Avviso" (quando notificare) — MULTI-selezione: array `reminds`
const REM=[['at',"All'orario"],['1h','1 ora prima'],['2h','2 ore prima'],['1d','Il giorno prima'],['2d','2 giorni prima'],['daily','Ogni giorno']];
// avvisi selezionati (array di chiavi). Compat col vecchio campo singolo `remind`. Default = ['at'].
function remindsSel(t){
  if(Array.isArray(t.reminds)) return t.reminds;
  if(t.remind) return t.remind==='none' ? [] : [t.remind];
  return ['at'];
}
function toggleRemind(t, key){
  let sel = remindsSel(t).slice();
  if(key==='none') sel=[];
  else if(sel.includes(key)) sel = sel.filter(x=>x!==key);
  else sel.push(key);
  t.reminds = sel; delete t.remind;
}
function remBtns(sel, act){   // sel = array delle chiavi selezionate; "Nessuno" a tutta larghezza + griglia 2 colonne
  return `<button class="chip rem-none ${sel.length===0?'on':''}" data-act="${act}" data-rem="none">Nessuno</button>`
    + `<div class="remgrid">`
    + REM.map(([k,l])=>`<button class="chip ${sel.includes(k)?'on':''}" data-act="${act}" data-rem="${k}">${l}</button>`).join('')
    + `</div>`;
}
// etichetta orario: singolo, finestra "9:00–18:00", o solo fine "entro le 18:00"
function timeLabel(t){
  if(t.time && t.timeEnd) return t.time+'–'+t.timeEnd;
  if(t.timeEnd) return 'entro le '+t.timeEnd;
  return t.time||'';
}
function rowHTML(t, mv){
  const p = t.priority && PRI[t.priority];
  const meta=[];
  const late = t.date && t.date<todayStr() && !t.done;
  const tl = timeLabel(t);
  if(t.date && state.view!=='cal'){
    meta.push(`<span class="m ${late?'late':''}">${svg('cal')}${relDay(t.date)}${tl?' · '+tl:''}</span>`);
  } else if(tl){
    meta.push(`<span class="m ${late?'late':''}">${svg('clock')}${tl}</span>`);
  }
  if(p) meta.push(`<span class="m"><span class="dot ${p.c}"></span>${p.l}</span>`);
  const cat=getCat(t.catId);
  if(cat){ const sub=getSub(cat,t.subId); meta.push(`<span class="m"><span class="dot" style="background:${cat.color}"></span>${esc(cat.name)}${sub?' · '+esc(sub.name):''}</span>`); }
  else if(t.list) meta.push(`<span class="m">${svg('tag')}${esc(t.list)}</span>`);
  if(t.attachments&&t.attachments.length) meta.push(`<span class="m">${svg('clip')}${t.attachments.length}</span>`);
  const subDone = t.subtasks? t.subtasks.filter(s=>s.done).length:0;
  if(t.subtasks&&t.subtasks.length) meta.push(`<span class="m">${svg('check')}${subDone}/${t.subtasks.length}</span>`);
  if(t.phone) meta.push(`<span class="m">${svg('phone')}</span>`);
  if(t.notes) meta.push(`<span class="m">${svg('note')}</span>`);
  const pcls = t.priority?`pri-${t.priority}`:'';
  const handle = (mv && mv.drag && !t.done) ? `<button class="drag" data-act="drag" data-id="${t.id}" aria-label="Trascina per riordinare">${svg('grip')}</button>` : '';
  return `<div class="row ${t.done?'done':''}" data-act="open" data-id="${t.id}">
      <button class="ck ${pcls}" data-act="toggle" data-id="${t.id}" aria-label="Completa">${svg('check')}</button>
      <div class="body">
        <div class="ttl">${esc(t.title)||'<span class="dim">Senza titolo</span>'}</div>
        ${meta.length?`<div class="meta">${meta.join('')}</div>`:''}
      </div>${handle}
    </div>`;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ SHEET ============ */
const sheet=$('#sheet'), scrim=$('#scrim'), sheetBody=$('#sheetbody'), sheetFoot=$('#sheetfoot');

function openSheet(id){

  else { t={id:uid(),title:'',notes:'',done:false,date:null,time:null,priority:null,list:'',phone:'',subtasks:[],attachments:[],createdAt:Date.now(),updatedAt:Date.now()}; tasks.unshift(t); sheetNew=true; }

  }

function renderSubs(){

      <button class="sck" data-act="sub-toggle" data-sid="${s.id}">${svg('check')}</button>

      <button class="del" data-act="sub-del" data-sid="${s.id}">${svg('x')}</button>
    </div>`).join('');
  el.innerHTML = `<div class="subs">${rows}</div>
    <div class="subadd">${svg('plus')}<input id="subnew" placeholder="Aggiungi sotto-task…" data-field="subnew"></div>`;
}
function renderAtts(){

function renderCallRow(){

  }
  if(t.phone){

    if(!exists) h += `<button class="linkbtn" data-act="call-save" style="margin-top:10px;background:none;border:none;padding:4px 2px">＋ Salva "${esc(nm)}" in rubrica</button>`;

function renderCatPick(){
  const t=getTask(state.editId); const el=$('#catpick'); if(!el)return;
  let h=`<div class="chips">`;
  h+=cats.map(c=>`<button class="catchip ${t.catId===c.id?'on':''}" data-act="cat-pick" data-cat="${c.id}" style="--cc:${c.color}"><i></i>${esc(c.name)}</button>`).join('');
  h+=`</div><div class="subadd" style="margin-top:8px">${svg('plus')}<input placeholder="Nuova categoria…" data-field="newcat"></div>`;
  const cat=getCat(t.catId);

    h+=`<div class="lbl" style="margin:14px 2px 8px">Sottocategoria · ${esc(cat.name)}</div><div class="chips">`;
    h+=(cat.subs||[]).map(s=>`<button class="catchip sm ${t.subId===s.id?'on':''}" data-act="sub-pick" data-sub="${s.id}" style="--cc:${cat.color}"><i></i>${esc(s.name)}</button>`).join('');
    h+=`</div><div class="subadd" style="margin-top:8px">${svg('plus')}<input placeholder="Nuova sottocategoria…" data-field="newsub"></div>`;
  }
  el.innerHTML=h;
}
function autoGrow(el){ if(!el)return; el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,220)+'px'; }

/* ============ WIZARD nuovo task (a step) ============ */
const WIZ = [
  {k:'desc', q:'Cosa devi fare?'},
  {k:'cat',  q:'In che categoria?'},
  {k:'when', q:'Quando?'},
  {k:'prio', q:'Che priorità?'},
  {k:'file', q:'Vuoi allegare un file?'},
];
let wizStep=0, wizTask=null, _wizAtts=[];
const wizEl=$('#wiz'), wizScrim=$('#wizscrim');
// Auto-focus SOLO su desktop (mouse). Su iOS il focus programmatico non apre la
// tastiera e blocca il tap successivo → niente auto-focus sui touch: si tocca il campo.
const CAN_AUTOFOCUS = !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches);
function autoFocus(sel){ if(!CAN_AUTOFOCUS) return; setTimeout(()=>{ const el=$(sel); if(el) el.focus(); },340); }
function openWizard(preset){
  wizTask={id:uid(),title:'',notes:'',done:false,date:(preset&&preset.date)||null,time:null,priority:null,list:'',catId:(preset&&preset.catId)||null,subId:null,phone:'',subtasks:[],attachments:[],createdAt:Date.now(),updatedAt:Date.now()};
  _wizAtts=[]; wizStep=0; renderWiz();
  document.body.classList.add('lock'); wizScrim.classList.add('on'); wizEl.classList.add('on');
  autoFocus('#wiztitle');
}
function wizClose(){ wizEl.classList.remove('on'); wizScrim.classList.remove('on'); document.body.classList.remove('lock'); }
function wizCancel(){ _wizAtts.forEach(id=>fileDel(id)); wizTask=null; _wizAtts=[]; wizClose(); }
function showWizErr(){ let e=$('#wizerr'); if(!e){ e=document.createElement('div'); e.className='wizerr'; e.id='wizerr'; const b=$('#wizbody'); if(b) b.appendChild(e); } if(e) e.textContent='Scrivi prima una descrizione'; if(CAN_AUTOFOCUS){ const el=$('#wiztitle'); if(el) el.focus(); } }
function wizNext(){ if(wizStep===0 && !wizTask.title.trim()){ showWizErr(); return; } if(wizStep<WIZ.length-1){ wizStep++; renderWiz(); } else wizFinish(); }
function wizBack(){ if(wizStep>0){ wizStep--; renderWiz(); } }
function wizFinish(){
  if(!wizTask) return;
  if(!wizTask.title.trim()){ wizStep=0; renderWiz(); showWizErr(); return; }
  wizTask.updatedAt=Date.now();
  tasks.unshift(wizTask); save(); reconcile(wizTask);
  wizTask=null; _wizAtts=[]; wizClose(); render(); toast('Task aggiunto ✓');
}
function wizPrio(key,val,t){ const on=(t.priority||null)===val; const label=key==='none'?'Nessuna':PRI[val].l; return `<button class="p-${key} ${on?'on':''}" data-act="wiz-prio" data-prio="${val||''}"><span class="d"></span>${label}</button>`; }
function renderWizAtts(){
  const el=$('#wizatts'); if(!el)return; const t=wizTask;
  const rows=(t.attachments||[]).map(a=>{ const isImg=(a.type||'').startsWith('image/');
    return `<div class="att"><span class="thumb">${isImg?svg('img'):svg('file')}</span><div class="info"><div class="an">${esc(a.name)}</div><div class="as">${fmtSize(a.size)}</div></div><button class="del" data-act="wiz-att-del" data-aid="${a.id}">${svg('trash')}</button></div>`; }).join('');
  el.innerHTML=`<div class="atts">${rows}</div><button class="attadd" data-act="wiz-file">${svg('plus')} Allega file (PDF, foto…)</button>`;
}
function renderWiz(){
  const step=WIZ[wizStep], t=wizTask; if(!t) return;
  $('#wizprog').innerHTML = WIZ.map((s,i)=>`<i class="${i<=wizStep?'on':''}"></i>`).join('');
  $('#wizstep').textContent = `passo ${wizStep+1} di ${WIZ.length}`;
  let h=`<div class="wizq">${step.q}</div>`;
  if(step.k==='desc'){
    h += `<textarea class="wizinput" id="wiztitle" data-wf="title" rows="2" placeholder="Descrizione del task…">${esc(t.title)}</textarea>`;
  } else if(step.k==='cat'){
    h += `<div class="chips">`+cats.map(c=>`<button class="catchip ${t.catId===c.id?'on':''}" data-act="wiz-cat" data-cat="${c.id}" style="--cc:${c.color}"><i></i>${esc(c.name)}</button>`).join('')+`</div>`;
    h += `<div class="subadd" style="margin-top:8px">${svg('plus')}<input placeholder="Nuova categoria…" data-wf="newcat"></div>`;
    const cat=getCat(t.catId);
    if(cat){ h += `<div class="lbl" style="margin:16px 2px 8px">Sottocategoria · ${esc(cat.name)}</div><div class="chips">`+(cat.subs||[]).map(s=>`<button class="catchip sm ${t.subId===s.id?'on':''}" data-act="wiz-sub" data-sub="${s.id}" style="--cc:${cat.color}"><i></i>${esc(s.name)}</button>`).join('')+`</div><div class="subadd" style="margin-top:8px">${svg('plus')}<input placeholder="Nuova sottocategoria…" data-wf="newsub"></div>`; }
  } else if(step.k==='when'){
    const hasWin = t.timeEnd!=null;
    h += `<div class="dtwrap" style="margin-bottom:8px">${svg('cal')}<input type="date" value="${t.date||''}" data-wf="date"></div>`;
    if(hasWin){
      h += `<div class="two">
          <div><div class="winlbl">Dalle</div><div class="dtwrap">${svg('clock')}<input type="time" value="${t.time||''}" data-wf="time"></div></div>
          <div><div class="winlbl">Alle</div><div class="dtwrap">${svg('clock')}<input type="time" value="${t.timeEnd||''}" data-wf="timeEnd"></div></div>
        </div>`;
    } else {
      h += `<div class="dtwrap">${svg('clock')}<input type="time" value="${t.time||''}" data-wf="time"></div>`;
    }
    h += `<button class="winchk ${hasWin?'on':''}" data-act="wiz-win-toggle" type="button"><span class="winbox">${hasWin?svg('check'):''}</span><span>Finestra oraria (es. 9–18)</span></button>`;
  } else if(step.k==='prio'){
    h += `<div class="priopts">${wizPrio('none',null,t)}${wizPrio('low','low',t)}${wizPrio('med','med',t)}${wizPrio('high','high',t)}</div>`;
    h += `<div class="lbl" style="margin:20px 2px 10px">${svg('bell')} Avviso <span style="font-weight:500;color:var(--txt3);text-transform:none;letter-spacing:0">· puoi sceglierne più di uno</span></div><div class="remopts">${remBtns(remindsSel(t), 'wiz-rem')}</div>`;
  } else if(step.k==='file'){
    h += `<div id="wizatts"></div>`;
  }
  $('#wizbody').innerHTML=h;
  if(step.k==='file') renderWizAtts();
  const back = wizStep>0 ? `<button class="wizbtn wizback" data-act="wiz-back" aria-label="Indietro">${svg('cl')}</button>` : `<button class="wizlink" data-act="wiz-cancel">Annulla</button>`;
  let right;
  if(wizStep===WIZ.length-1) right = `<button class="wizbtn primary" data-act="wiz-finish">${svg('check')} Aggiungi</button>`;
  else if(wizStep===0) right = `<button class="wizbtn primary" data-act="wiz-next">Avanti ${svg('cr')}</button>`;
  else right = `<button class="wizlink" data-act="wiz-next">Salta</button><button class="wizbtn primary" data-act="wiz-next">Avanti ${svg('cr')}</button>`;
  const finishNow = (wizStep>0 && wizStep<WIZ.length-1) ? `<button class="wizlink" data-act="wiz-finish">Fine</button>` : '';
  $('#wizfoot').innerHTML = `${back}<div class="sp"></div>${finishNow}${right}`;
  if(step.k==='desc') autoGrow($('#wiztitle'));
}

/* ============ ACTIONS ============ */
function touch(t){ t.updatedAt=Date.now(); save(); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act;

  if(a==='nav'){ const v=el.dataset.view; if(v===state.view)return; const order=['today','tasks','cal','scritte']; const dir=order.indexOf(v)>order.indexOf(state.view)?1:-1; state.view=v; render(dir); return; }
  if(a==='today-jump'){ state.view='today'; state.calSel=todayStr(); render(); return; }
  if(a==='notif'){ notifEnable(); return; }
  if(a==='new'){ if(state.view==='scritte') openScritta(null); else openWizard(); return; }
  if(a==='new-on'){ openWizard({date:el.dataset.date}); return; }
  if(a==='scr-open'){ openScritta(el.dataset.id); return; }
  if(a==='scr-month'){ state.scritteMonth=el.dataset.m; renderScritte(); return; }
  if(a==='scr-cancel'){ closeScritta(false); return; }
  if(a==='scr-save'){ closeScritta(true); return; }
  if(a==='scr-del'){ scrDelete(); return; }
  if(a==='scr-photo'){ const fp=$('#scrpick'); fp.value=''; fp.click(); return; }
  if(a==='scr-photo-lib'){ const fp=$('#scrpicklib'); fp.value=''; fp.click(); return; }
  if(a==='scr-delphoto'){ if(scrEdit){ if(scrEdit.photoId&&scrEdit.photoId!==_scrOrig) fileDel(scrEdit.photoId); scrEdit.photoId=null; renderScrPhoto(); } return; }
  if(a==='scr-viewphoto'){ if(scrEdit&&scrEdit.photoId) openAttachment(scrEdit.photoId); return; }
  if(a==='wiz-cancel'){ wizCancel(); return; }
  if(a==='wiz-back'){ wizBack(); return; }
  if(a==='wiz-next'){ wizNext(); return; }
  if(a==='wiz-finish'){ wizFinish(); return; }
  if(a==='wiz-cat'){ const id=el.dataset.cat; wizTask.catId=(wizTask.catId===id?null:id); wizTask.subId=null; renderWiz(); return; }
  if(a==='wiz-sub'){ const id=el.dataset.sub; wizTask.subId=(wizTask.subId===id?null:id); renderWiz(); return; }
  if(a==='wiz-prio'){ wizTask.priority=el.dataset.prio||null; renderWiz(); return; }
  if(a==='wiz-win-toggle'){ if(!wizTask)return; wizTask.timeEnd = (wizTask.timeEnd==null) ? (wizTask.time||'18:00') : null; renderWiz(); return; }
  if(a==='wiz-rem'){ if(!wizTask)return; toggleRemind(wizTask, el.dataset.rem);
    const sel=remindsSel(wizTask); document.querySelectorAll('.remopts .chip').forEach(c=>{ const k=c.dataset.rem; c.classList.toggle('on', k==='none'?sel.length===0:sel.includes(k)); }); return; }
  if(a==='wiz-file'){ const fp=$('#filepick'); fp.value=''; fp._wiz=true; fp.click(); return; }
  if(a==='wiz-att-del'){ const aid=el.dataset.aid; wizTask.attachments=wizTask.attachments.filter(x=>x.id!==aid); _wizAtts=_wizAtts.filter(x=>x!==aid); fileDel(aid); renderWizAtts(); return; }
  if(a==='close-sheet'){ closeSheet(); return; }

  if(a==='toggle'){ e.stopPropagation(); const t=getTask(el.dataset.id); if(!t)return;
    t.done=!t.done; touch(t); reconcile(t);
    const ck=el; if(M){try{M.animate(ck,{scale:[1,1.32,1]},{duration:.34});}catch(e){}} else ck.classList.add('pop');
    const allDoneNow = t.done && t.date===todayStr() && tasks.filter(x=>x.date===todayStr()&&!x.done).length===0;
    setTimeout(()=>{ render(); if(allDoneNow) toast('Tutto fatto per oggi 🎉'); },160);
    return; }

  if(a==='drag'){ return; }   // gestita via pointer events, il tocco non apre il task

  if(a==='open'){ openSheet(el.dataset.id); return; }

  if(a==='filter'){ state.filter=el.dataset.filter;
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.filter===state.filter));
    fillTaskList(); return; }
  if(a==='cat-pick'){ const t=getTask(state.editId); const id=el.dataset.cat; t.catId=(t.catId===id?null:id); t.subId=null; touch(t); renderCatPick(); return; }
  if(a==='sub-pick'){ const t=getTask(state.editId); const id=el.dataset.sub; t.subId=(t.subId===id?null:id); touch(t); renderCatPick(); return; }
  if(a==='catfilter'){ state.catFilter=el.dataset.cat; state.subFilter='all'; renderTasks(); return; }
  if(a==='subfilter'){ state.subFilter=el.dataset.sub; renderTasks(); return; }
  if(a==='cat-manage'){ state.catManage=!state.catManage; renderTasks(); return; }
  if(a==='cat-del'){ const c=getCat(el.dataset.cat); if(c && confirm(`Eliminare la categoria "${c.name}"? Verrà tolta dai task.`)){ delCat(el.dataset.cat); if(state.catFilter===el.dataset.cat){state.catFilter='all';state.subFilter='all';} renderTasks(); } return; }
  if(a==='catsub-del'){ delSub(el.dataset.cat, el.dataset.sub); renderTasks(); return; }

  if(a==='cal-prev'){ let {y,m}=state.calMonth; m--; if(m<0){m=11;y--;} state.calMonth={y,m}; renderCal(); return; }
  if(a==='cal-next'){ let {y,m}=state.calMonth; m++; if(m>11){m=0;y++;} state.calMonth={y,m}; renderCal(); return; }
  if(a==='cal-day'){ state.calSel=el.dataset.date; renderCal(); return; }

  // ---- sheet interne ----
  if(a==='prio'){ const t=getTask(state.editId); t.priority=el.dataset.prio||null; touch(t);
    document.querySelectorAll('#prio button').forEach(b=>b.classList.toggle('on',(b.dataset.prio||'')===(t.priority||''))); return; }
  if(a==='win-toggle'){ const t=getTask(state.editId); if(!t)return; t.timeEnd = (t.timeEnd==null) ? (t.time||'18:00') : null; touch(t); reconcile(t); renderSheet(); return; }
  if(a==='rem'){ const t=getTask(state.editId); if(!t)return; toggleRemind(t, el.dataset.rem); touch(t); reconcile(t);
    const sel=remindsSel(t); document.querySelectorAll('.remopts .chip').forEach(c=>{ const k=c.dataset.rem; c.classList.toggle('on', k==='none'?sel.length===0:sel.includes(k)); }); return; }
  if(a==='del-task'){ const id=state.editId; sheet.classList.remove('on'); scrim.classList.remove('on'); document.body.classList.remove('lock');
    deleteTask(id); state.editId=null; sheetNew=false; render(); return; }
  if(a==='sub-toggle'){ const t=getTask(state.editId); const s=t.subtasks.find(x=>x.id===el.dataset.sid); if(s){s.done=!s.done; touch(t); renderSubs();} return; }
  if(a==='sub-del'){ const t=getTask(state.editId); t.subtasks=t.subtasks.filter(x=>x.id!==el.dataset.sid); touch(t); renderSubs(); return; }
  if(a==='att-add'){ const fp=$('#filepick'); fp.value=''; fp._tid=state.editId; fp.click(); return; }
  if(a==='att-del'){ const t=getTask(state.editId); const aid=el.dataset.aid; t.attachments=t.attachments.filter(x=>x.id!==aid); touch(t); fileDel(aid); renderAtts(); return; }
  if(a==='att-open'){ openAttachment(el.dataset.aid); return; }
  if(a==='viewer-close'){ closeViewer(); return; }
  if(a==='viewer-ext'){ viewerExternal(); return; }
  if(a==='call-use'){ const t=getTask(state.editId); if(!t)return; t.phone=el.dataset.phone; touch(t); const inp=sheetBody.querySelector('[data-field=phone]'); if(inp) inp.value=t.phone; renderCallRow(); return; }
  if(a==='call-save'){ const t=getTask(state.editId); if(!t||!t.phone)return; const nm=extractCallName(t.title)||(t.title||'').trim()||t.phone; if(!contacts.some(c=>telHref(c.phone)===telHref(t.phone))){ contacts.push({id:uid(),name:nm,phone:t.phone}); saveContacts(); toast('Salvato in rubrica'); } renderCallRow(); return; }
});

/* submit quick-add (Oggi) */
document.addEventListener('submit',e=>{
  if(e.target.dataset.act==='qadd-form'){ e.preventDefault();
    const inp=$('#qadd'); const v=inp.value.trim(); if(!v)return;
    const t={id:uid(),title:v,notes:'',done:false,date:todayStr(),time:null,priority:null,list:'',subtasks:[],attachments:[],createdAt:Date.now(),updatedAt:Date.now()};
    tasks.unshift(t); save(); inp.value=''; renderToday();
    const first=main.querySelector('.list .row'); if(first&&M){try{M.animate(first,{opacity:[0,1],y:[-8,0]},{duration:.3});}catch(e){}}
  }
});

/* input/change delegati (sheet + ricerca) */
document.addEventListener('input',e=>{
  const sf=e.target.dataset.sf;
  if(sf && scrEdit){ if(sf==='desc') scrEdit.desc=e.target.value; else if(sf==='tipo') scrEdit.tipo=e.target.value; return; }
  const wf=e.target.dataset.wf;
  if(wf && wizTask){
    if(wf==='title'){ wizTask.title=e.target.value; autoGrow(e.target); const er=$('#wizerr'); if(er) er.remove(); }
    return;
  }
  const f=e.target.dataset.field;
  if(f==='title'){ const t=getTask(state.editId); t.title=e.target.value; touch(t); autoGrow(e.target); if($('#callrow')) renderCallRow(); }
  else if(f==='notes'){ const t=getTask(state.editId); t.notes=e.target.value; touch(t); autoGrow(e.target); }
  else if(f==='list'){ const t=getTask(state.editId); t.list=e.target.value.trim(); touch(t); }
  else if(f==='phone'){ const t=getTask(state.editId); t.phone=e.target.value.trim(); touch(t); renderCallRow(); }
  else if(f==='q'){ state.q=e.target.value; fillTaskList(); }
  const cr=e.target.dataset.catren; if(cr){ const c=getCat(cr); if(c){ c.name=e.target.value; saveCats(); } }
});
document.addEventListener('change',e=>{
  const sf=e.target.dataset.sf;
  if(sf && scrEdit){ if(sf==='month') scrEdit.month=e.target.value||null; return; }
  const wf=e.target.dataset.wf;
  if(wf && wizTask){
    if(wf==='date'){ wizTask.date=e.target.value||null; }
    else if(wf==='time'){ wizTask.time=e.target.value||null; }
    else if(wf==='timeEnd'){ wizTask.timeEnd=e.target.value||null; }
    return;
  }
  const f=e.target.dataset.field;
  if(f==='date'){ const t=getTask(state.editId); t.date=e.target.value||null; touch(t); reconcile(t); }
  else if(f==='time'){ const t=getTask(state.editId); t.time=e.target.value||null; touch(t); reconcile(t); }
  else if(f==='timeEnd'){ const t=getTask(state.editId); t.timeEnd=e.target.value||null; touch(t); reconcile(t); }
});
document.addEventListener('keydown',e=>{
  const wf=e.target.dataset.wf;
  if(wf && wizTask && e.key==='Enter'){
    e.preventDefault();
    if(wf==='title'){ wizNext(); }
    else if(wf==='newcat'){ const c=addCat(e.target.value); if(c){ wizTask.catId=c.id; wizTask.subId=null; renderWiz(); } }
    else if(wf==='newsub'){ const s=addSub(wizTask.catId, e.target.value); if(s){ wizTask.subId=s.id; renderWiz(); } }
    return;
  }

let _viewer={url:null, rec:null};
let _pdfjs=null;
async function loadPdfjs(){
  if(_pdfjs) return _pdfjs;
  const V='4.7.76';
  const mod=await import(`https://cdn.jsdelivr.net/npm/pdfjs-dist@${V}/build/pdf.min.mjs`);
  mod.GlobalWorkerOptions.workerSrc=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${V}/build/pdf.worker.min.mjs`;

}
async function openAttachment(aid){
  const rec=await fileGet(aid);
  if(!rec){ toast('File non trovato'); return; }
  if(_viewer.url) URL.revokeObjectURL(_viewer.url);
  const url=URL.createObjectURL(rec.blob);
  _viewer={url, rec};
  $('#vname').textContent=rec.name||'Allegato';
  const body=$('#vbody'); body.innerHTML='<div class="vspin"></div>';
  $('#viewer').classList.add('on'); document.body.classList.add('lock');
  const type=rec.type||''; const name=(rec.name||'').toLowerCase();
  try{
    if(type.startsWith('image/')){
      body.innerHTML=`<img src="${url}" alt="${esc(rec.name)}">`;
    } else if(type==='application/pdf' || name.endsWith('.pdf')){
      await renderPdf(rec, body);
    } else if(type.startsWith('text/') || /\.(txt|csv|md|json|log)$/i.test(name)){
      const txt=await rec.blob.text();
      const pre=document.createElement('pre'); pre.textContent=txt.slice(0,100000);
      body.innerHTML=''; body.appendChild(pre);
    } else {
      body.innerHTML=`<div class="vmsg"><div class="ic">${svg('file')}</div><b>Anteprima non disponibile</b><p style="color:#bbb;font-size:13.5px;margin-top:6px">Tipo file: ${esc(type||'sconosciuto')}.</p><button class="btn" data-act="viewer-ext" style="margin-top:16px">${svg('download')} Apri / Scarica</button></div>`;
    }
  }catch(e){
    body.innerHTML=`<div class="vmsg"><div class="ic">${svg('file')}</div><b>Impossibile aprire il file</b><button class="btn" data-act="viewer-ext" style="margin-top:14px">${svg('download')} Apri / Scarica</button></div>`;
  }
}
async function renderPdf(rec, body){
  const pdfjs=await loadPdfjs();
  const data=new Uint8Array(await rec.blob.arrayBuffer());
  const pdf=await pdfjs.getDocument({data}).promise;
  body.innerHTML='';
  const maxW=Math.min((body.clientWidth||360)-24, 760);
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const n=Math.min(pdf.numPages, 30);
  for(let i=1;i<=n;i++){
    const page=await pdf.getPage(i);
    const v1=page.getViewport({scale:1});
    const vp=page.getViewport({scale:maxW/v1.width});
    const canvas=document.createElement('canvas');
    canvas.width=Math.floor(vp.width*dpr); canvas.height=Math.floor(vp.height*dpr);
    canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
    const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
    body.appendChild(canvas);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
  }
  if(pdf.numPages>n){ const m=document.createElement('div'); m.className='vmsg'; m.style.margin='20px auto 0'; m.innerHTML=`<p style="color:#bbb">…prime ${n} pagine di ${pdf.numPages}.</p>`; body.appendChild(m); }
}
