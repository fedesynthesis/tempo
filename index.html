/* ---- delete con annulla ---- */
let pendingDel=null;
function deleteTask(id){
  const idx=tasks.findIndex(x=>x.id===id); if(idx<0)return;
  const t=tasks[idx]; tasks.splice(idx,1); save(); reconcileRemove(id);
  if(pendingDel){ clearTimeout(pendingDel.timer); purge(pendingDel.task); }
  pendingDel={task:t, timer:setTimeout(()=>{ purge(t); pendingDel=null; }, 6000)};
  toast('Task eliminato', 'Annulla', ()=>{ tasks.splice(Math.min(idx,tasks.length),0,t); save(); reconcile(t); clearTimeout(pendingDel.timer); pendingDel=null; render(); });
}
function purge(t){ (t.attachments||[]).forEach(a=>fileDel(a.id)); }

/* ---- toast ---- */
let toastTimer=null;
function toast(msg, actLabel, cb){
  const el=$('#toast');
  el.innerHTML = esc(msg) + (actLabel?` <button id="tact">${esc(actLabel)}</button>`:'');
  el.classList.add('on');
  if(actLabel&&cb){ $('#tact').onclick=()=>{ cb(); el.classList.remove('on'); }; }
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'), actLabel?6000:2400);
}

/* ============ SHEET DRAG (giù = chiudi) ============ */
(function(){
  const grab=$('#grab'); let startY=0,cur=0,drag=false;
  const onDown=y=>{ drag=true; startY=y; cur=0; sheet.style.transition='none'; };
  const onMove=y=>{ if(!drag)return; cur=Math.max(0,y-startY); sheet.style.transform=`translateY(${cur}px)`; scrim.style.opacity=String(Math.max(0,1-cur/400)); };
  const onUp=()=>{ if(!drag)return; drag=false; sheet.style.transition=''; scrim.style.opacity='';
    if(cur>130){ closeSheet(); } else { sheet.style.transform=''; } cur=0; };
  grab.addEventListener('touchstart',e=>onDown(e.touches[0].clientY),{passive:true});
  grab.addEventListener('touchmove',e=>onMove(e.touches[0].clientY),{passive:true});
  grab.addEventListener('touchend',onUp);
  grab.addEventListener('mousedown',e=>{onDown(e.clientY); const mm=ev=>onMove(ev.clientY),mu=()=>{onUp();document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);}; document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);});
})();

/* ============ IMPORT via link (#import=base64) ============ */
function tryImport(){
  const m=(location.hash||'').match(/^#import=([\s\S]+)$/);
  if(!m) return 0;
  let data;
  try{ data=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); }
  catch(e){ history.replaceState(null,'',location.pathname+location.search); return 0; }
  history.replaceState(null,'',location.pathname+location.search); // evita re-import al refresh
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.tasks) ? data.tasks : null);
  if(!list) return 0;
  if(data && data.replace) tasks = [];   // modalità "ripulisci e imposta"
  const byKey = new Map(tasks.map(t=>[(t.title||'').trim().toLowerCase()+'|'+(t.date||''), t]));
  let n=0;
  list.forEach(d=>{
    if(!d||!d.title) return;
    const key=String(d.title).trim().toLowerCase()+'|'+(d.date||'');
    const ex = byKey.get(key);
    if(ex){ // già presente → aggiorna categoria/priorità se fornite (niente doppioni)
      let upd=false;
      if(d.catId!==undefined && ex.catId!==d.catId){ ex.catId=d.catId; ex.subId=(d.subId||null); upd=true; }
      if(d.priority!==undefined && d.priority!==null && ex.priority!==d.priority){ ex.priority=d.priority; upd=true; }
      if(upd){ ex.updatedAt=Date.now(); n++; }
    } else {
      const t={id:uid(),title:String(d.title),notes:d.notes||'',done:!!d.done,date:d.date||null,time:d.time||null,priority:d.priority||null,list:'',catId:d.catId||null,subId:d.subId||null,phone:'',subtasks:[],attachments:[],createdAt:Date.now(),updatedAt:Date.now()};
      tasks.push(t); byKey.set(key,t); n++;
    }
  });
  if(n) save();
  return n;
}

/* ============ Firebase reminder hooks (no-op finché non configuri le chiavi) ============ */
function reconcile(t){ try{ if(t && window.fb && window.fb.ready) window.fb.syncTask(t); }catch(e){} }
function reconcileRemove(id){ try{ if(window.fb && window.fb.ready) window.fb.removeTask(id); }catch(e){} }

/* ---- Sync multi-dispositivo (modello tombstone: MAI cancellazioni per assenza) ---- */
let _applyingCats = false;
function applyRemoteTasks(remote){
  try{
    remote = (remote||[]).filter(t=>t&&t.id);
    const remoteById = new Map(remote.map(t=>[t.id, t]));
    const byId = new Map(tasks.map(t=>[t.id, t]));
    const tombstoned = new Set();
    let changed=false;
    // 1) applica dal remoto: tombstone → rimuovi; altrimenti adotta se più recente/nuovo
    remoteById.forEach((r,id)=>{
      if(r.deleted){ tombstoned.add(id); if(byId.has(id)){ byId.delete(id); changed=true; } return; }
      const l = byId.get(id);
      const ru = Number(r.updatedAt)||0, lu = l ? (Number(l.updatedAt)||0) : -1;
      if(!l || ru > lu){ byId.set(id, r); changed=true; }
    });
    // 2) NIENTE delete-by-absence. Carico i task locali non presenti sul remoto (e non tombstonati)
    tasks.forEach(l=>{ if(l.id && !remoteById.has(l.id) && !tombstoned.has(l.id)) reconcile(l); });
    // 3) de-duplica per contenuto (copie con id diversi): tengo l'id minore, tombstono gli altri
    const groups=new Map();
    byId.forEach((t,id)=>{ if(t.deleted||!(t.title||'').trim())return; const k=(t.title).trim().toLowerCase()+'|'+(t.date||'')+'|'+(t.time||''); if(!groups.has(k))groups.set(k,[]); groups.get(k).push(id); });
    groups.forEach(ids=>{ if(ids.length>1){ ids.sort(); for(let i=1;i<ids.length;i++){ byId.delete(ids[i]); reconcileRemove(ids[i]); changed=true; } } });
    if(changed){
      tasks = [...byId.values()].filter(t=>!t.deleted); save();
      const busy = document.getElementById('sheet').classList.contains('on') || document.getElementById('wiz').classList.contains('on');
      if(!busy) render();
    }
  }catch(e){ console.warn('applyRemoteTasks', e); }
}
function applyRemoteCats(list){
  try{
    const byId=new Map(cats.map(c=>[c.id,c])); let changed=false;
    (list||[]).forEach(rc=>{ if(rc&&rc.id&&!byId.has(rc.id)){ byId.set(rc.id,rc); changed=true; } });
    if(changed){ _applyingCats=true; cats=[...byId.values()]; localStorage.setItem(CATKEY,JSON.stringify(cats)); _applyingCats=false; if(state.view==='tasks') renderTasks(); }
  }catch(e){ console.warn('applyRemoteCats', e); }
}
// Scritte: merge come i task (tombstone, last-write-wins, MAI cancellazione per assenza)
function applyRemoteScritte(remote){
  try{
    remote=(remote||[]).filter(s=>s&&s.id);
    const byId=new Map(scritte.map(s=>[s.id,s])); let changed=false;
    remote.forEach(r=>{
      if(r.deleted){ if(byId.has(r.id)){ byId.delete(r.id); changed=true; } return; }
      const l=byId.get(r.id); const ru=Number(r.updatedAt)||0, lu=l?(Number(l.updatedAt)||0):-1;
      if(!l || ru>lu){ byId.set(r.id, r); changed=true; }
    });
    if(changed){ scritte=[...byId.values()].filter(s=>!s.deleted); saveScritte();
      const busy=document.getElementById('scrsheet').classList.contains('on');
      if(state.view==='scritte' && !busy) renderScritte();
    }
  }catch(e){ console.warn('applyRemoteScritte', e); }
}
document.addEventListener('fb-ready',()=>{
  try{
    if(window.fb.startSync){
      window.fb.startSync(applyRemoteTasks, applyRemoteCats, applyRemoteScritte);
      window.fb.syncCats && window.fb.syncCats(cats);
      scritte.forEach(s=>{ try{ window.fb.syncScritta(s); }catch(e){} });   // pubblica le scritte locali
      cloudBackfill();                                                       // carica le immagini già presenti in locale
    } else tasks.forEach(reconcile);
  }catch(e){}
});

  if(!window.fb || !window.fb.ready){ toast('Prima configura Firebase (vedi SETUP-notifiche.md)'); return; }
